name: docs

# Build the MkDocs site and publish it to the `gh-pages` branch (which GitHub
# Pages serves at spineprep.com). Runs on every push to main, on published
# releases, and on demand. `docs/CNAME` (spineprep.com) is copied into the
# build, so the custom domain persists across deploys.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # gh-deploy pushes to the gh-pages branch

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install docs dependencies
        run: poetry install --with docs

      - name: Deploy docs to gh-pages
        run: poetry run mkdocs gh-deploy --force
