name: container

# Build the SpinePrep container from Dockerfile.spineprep and OPTIONALLY push it
# to the GitHub Container Registry (GHCR).
#
# This workflow is manual (workflow_dispatch) on purpose:
#   * The build is heavy (installs SCT, FSL, ANTs and pre-downloads deepseg
#     models) and pushing is opt-in.
#   * A pushed image REDISTRIBUTES FSL. FSL permits that under its
#     non-commercial terms (see NOTICE), but SpinePrep's default distribution is
#     the build recipe. Only push if you accept and pass on FSL's terms.
#
# Set the "push" input to true to publish to
#   ghcr.io/<owner-lowercased>/spineprep:{latest,<git-describe>}

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (redistributes FSL under its non-commercial terms)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af || true
          df -h

      - name: Compute lowercase owner and version
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --always --tags)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.spineprep
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/spineprep:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/spineprep:${{ steps.meta.outputs.version }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_DESCRIBE=${{ steps.meta.outputs.version }}
