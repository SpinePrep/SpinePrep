version: 1

# Per-run template normalization. CoSpi-validated pattern: pure compose
# of S2 anat<->PAM50 with S6 bold<->anat warps. Never resamples 4D BOLD
# into PAM50 (Eippert 2017 lineage). Only S9 will push cope/zstat to PAM50.
#
# Refinement (SCT batch_processing.sh fMRI block second pass with
# bsplinesyn iter=5) is supported but DISABLED by default because:
#   1. S6 already does a thorough cord-driven func<->anat registration
#      (centermassrot -> columnwise -> bsplinesyn iter=20, slicewise).
#      Further refinement adds noise without information gain.
#   2. SCT's fMRI block uses MeanSquares on full PAM50_T2s vs EPI; this
#      can drift on T1w-init / T2*-EPI cases where the anatomical FOV
#      mismatch is large.
#   3. Validated on the pain dataset: refinement dropped Dice from 0.82
#      (compose-only) to 0.68. The CoSpi reference pipeline does NOT
#      refine and matches its published Balgrist results.
# Set refinement.enable=true to opt in for experimentation.

template:
  name: "PAM50"
  reference_modality: "T2s"     # PAM50_t2s — best contrast match for T2*-EPI
  data_dir: null                # null -> use $SCT_DIR/data/PAM50

refinement:
  enable: false                 # off by default (see header)
  step1:
    type: "seg"
    algo: "slicereg"
    metric: "MeanSquares"
    smooth: 2
  step2:
    type: "im"
    algo: "bsplinesyn"
    metric: "MeanSquares"
    iter: 5
    gradStep: 0.5
  interpolation: "spline"

atlas:
  warp_full_atlas: true         # -a 1 (full PAM50 atlas + masks in native func)
  masks_to_emit:
    - "PAM50_cord"
    - "PAM50_csf"
    - "PAM50_wm"
    - "PAM50_gm"
    - "PAM50_spinal_levels"

interpolation:
  # SCT sct_apply_transfo accepts only `nn | linear | spline`. The
  # ANTs name `LanczosWindowedSinc` was silently rejected/substituted
  # (audit Finding 6 in s7-algorithm-audit.md). Use SCT's spline for
  # the 3D funcref-in-PAM50 QC push.
  bold:  "spline"               # funcref-in-PAM50 (QC only)
  mask:  "nn"                   # PAM50 masks → native func (binary)
  label: "nn"                   # PAM50 spinal_levels → native func (integer)
  anat:  "linear"               # anat resamples

qc_thresholds:
  # Cord Dice in NATIVE func space: PAM50_cord warped to func vs S6 func
  # cord_seg. Compose-only typically lands at 0.80–0.85 (limited by S6's
  # native Dice cap + the additional PAM50<->anat composition step).
  # Used both for the overall `cord_dice_native_func` gate AND for the
  # per-level `cord_dice_per_level` reportlet color bands.
  # PER-LEVEL gate (primary, coverage-independent). The whole-volume Dice
  # below is confounded by functional cord COVERAGE: a corticospinal /
  # brain+cord acquisition images only a few cervical levels, capping the
  # whole-volume overlap ~0.84 even for a perfect registration. So gate on
  # the MEDIAN per-level cord Dice (registration quality where the cord is
  # covered), with a min-per-level guard for a single broken edge level.
  # Three-banded (PASS / WARN / FAIL), matching the whole-volume shape below.
  # Provenance: the PASS level was calibrated on CoSpiGVS alone, where good
  # runs clustered at 0.95-1.00 and failures at 0.87-0.88. That separation did
  # NOT transfer to the full cohort. Measured on 9 datasets / 456 runs:
  # median 0.978, p5 0.915, p1 0.815. A hard FAIL cliff at 0.90 therefore sat
  # inside the distribution's own low tail and split runs of the SAME subject
  # and acquisition (0.8997 FAIL beside 0.9019 PASS — within run-to-run noise),
  # while the cohort's genuine failure group sits at <=0.82, well separated.
  # So 0.90 is kept as the PASS level and 0.85 added as the FAIL floor; the
  # band between routes to visual inspection rather than discarding the run.
  # When cord_dice_per_level is present the classifier uses these; the
  # whole-volume keys below are the legacy fallback + observability.
  per_level_pass_min: 0.90          # median per-level cord Dice >= this = PASS
  per_level_fail_below: 0.85        # < this = FAIL; [0.85, 0.90) = WARN (inspect overlay)
  per_level_broken_below: 0.50      # any single level < this = WARN (exclude that level)
  # Whole-volume cord Dice (legacy fallback / observability only when
  # per-level Dice is unavailable). PAM50_cord warped to func vs S6 func
  # cord_seg. Compose-only typically lands at 0.80–0.85.
  pass_dice_min: 0.80
  fail_dice_below: 0.65              # < this = FAIL; [fail, pass) = WARN; >= pass = PASS
  # Cord-restricted round-trip drift on native func (audit Finding 4 in
  # s7-algorithm-audit.md replaced the FOV-wide intensity-weighted COM
  # which was background-dominated). Observability-only for v1; surface
  # in qc.json for diagnostic value but don't gate (bsplinesyn's forward
  # and inverse are separately optimised → non-zero intrinsic drift even
  # at Dice 0.95). Add thresholds here if a regression surfaces.

reproducibility:
  strict: false                 # ANTS_RANDOM_SEED=1 + ITK_THREADS=1 when true
  capture_provenance: true

# NOTE: a `cost_controls` block (skip_existing_pass, estimate_per_run_minutes,
# check_code_hash) was removed 2026-07-19. None of those keys was ever read by
# any code -- the policy advertised resumability and code-hash checking that do
# not exist. Only S9 has a resume path, and it is gated by the
# SPINEPREP_S9_FORCE environment variable, not by policy.
