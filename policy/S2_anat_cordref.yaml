version: 2

selection:
  # Dual-role anat selection:
  #
  # PRIMARY anat (this `preference` list) drives labeling (sct_label_vertebrae,
  # TotalSpineSeg), rootlets, PAM50 registration, and visualization
  # reportlets. Must be full-FOV — T2* / MEGRE (typically cord-only ~60mm Z)
  # is excluded because sct_label_vertebrae requires C2/C3 disc detection
  # and only accepts -c t1/-c t2.
  preference:
    - T2w
    - T1w
  # SECONDARY cordref (only used by S5/S6 func->anat registration) — when
  # T2star/MEGRE is available alongside the primary anat, S2 produces a
  # second cordref + cord_dseg in the matched contrast. T2*-anat <-> T2*-EPI
  # gives the cleanest seg-driven registration. When only the primary
  # modality is available, S5/S6 fall back to it automatically.
  secondary_cordref_preference:
    - T2star

# MEGRE synthesis: when a candidate is detected as multi-echo MEGRE
# (BIDS: sub-XX_acq-MEGRE_run-NN_echo-EE_part-mag_T2star.nii.gz), build a
# single 3D T2* image by RMS across echoes per run, then mean across runs.
# Recipe verbatim from CoSpi/spi03_anat_preproc.sh.
megre_synthesis:
  echo_combine: rms          # rms | mean | first_echo
  run_combine: mean          # mean | rms | first_run

standardize:
  orientation: RPI

discover:
  method: deepseg
  task: spinalcord
  contrast_map:
    T2star: t2s
    T2w: t2
    T1w: t1
  # Sanity-floor to catch "cord seg returned empty"; 10 slices is enough
  # cord coverage to be useful. MEGRE-style cervical-only acquisitions
  # typically have 12 slices.
  min_z_slices: 10

crop:
  # Deprecated: size_vox, z_full (kept for backward compat but ignored)
  size_vox: [96, 96]
  z_full: true
  mask_diameter_mm: 60
  dilate_xyz: [0, 0, 0]
  min_z_slices: 10

segmentation:
  # Cord segmentation method:
  #   contrast_agnostic: sct_deepseg spinalcord (optimized for CSA consistency)
  #   totalspineseg: extract cord from TotalSpineSeg output (simpler, all-in-one)
  cord_method: contrast_agnostic
  # Legacy settings (kept for backward compat)
  method: sct_deepseg_sc
  contrast_map:
    T2star: t2s
    T2w: t2
    T1w: t1

labeling:
  # Labeling method:
  #   totalspineseg: sct_deepseg -task totalspineseg (default, provides canal + vertebrae + labels)
  #   sct_label_vertebrae: legacy method
  method: totalspineseg
  # Legacy settings (used when method=sct_label_vertebrae)
  clean_labels: 1
  initcenter: 3
  # TotalSpineSeg QC thresholds
  qc_thresholds:
    min_vertebral_levels: 5
    min_coverage_ratio: 0.8
    max_inter_level_gap_mm: 15
    min_confidence: 0.7

rootlets:
  enabled: true
  eligible_modalities:
    - T2w
    - T1w

registration:
  template: PAM50
  prefer_rootlets: true

# Step-local truth gate (CLAUDE.md dev principle §3).
#
# PRIMARY gate: per-vertebral-level median cord Dice (coverage-independent).
# Whole-cord 3D Dice (pam50_cord_dice) is confounded by cord COVERAGE — a
# subject whose imaged cord runs below the cervically-anchored registration is
# penalised for uncovered cord that is not a registration error — and a single
# Dice on a tube is blind to S-I misalignment. Empirically on CoSpiGVS whole-
# cord Dice WARNed 10/11 good subjects at the old 0.80 bar (range 0.74-0.80),
# so it is now demoted to observability and the gate moved to per-level, the
# same convention S7 uses on the functional side. See
# .claude/specs/s2-algorithm-audit.md F1.
qc_thresholds:
  # Per-level primary gate, three-banded (PASS / WARN / FAIL).
  #
  # The PASS level was copied from S7's band, which S7 had calibrated on
  # CoSpiGVS *functional* data; it was never validated on anatomical data. S7
  # gave this gate a WARN band on 2026-07-18 after the cohort showed a hard
  # 0.90 cliff sitting inside the distribution's own low tail and splitting
  # runs of the SAME subject (0.8997 FAIL beside 0.9019 PASS). S2 kept the
  # cliff until 2026-07-19.
  #
  # The consequence here is larger than in S7: S2 is the anatomical reference,
  # so a FAIL loses the ENTIRE subject, every run, not one run. Measured on the
  # 469-run cohort, S2's per-level median Dice runs min 0.9107 / p5 0.9373 /
  # median 0.9604 -- the minimum sits 0.011 above the cliff, so this has not
  # fired yet, but 51 subjects lie in the 0.85-0.95 band.
  per_level_pass_min: 0.90         # median per-level cord Dice >= this = PASS
  per_level_fail_below: 0.85       # < this = FAIL; [0.85, 0.90) = WARN (inspect overlay)
  per_level_broken_below: 0.50     # any single level < this = WARN (exclude that level)
  # Whole-cord Dice — observability + legacy fallback ONLY when per-level is
  # unavailable. Bands are NOT literature-anchored (no published cord-reg Dice
  # band exists); recalibrate on the full 8-dataset cohort, do not cite as
  # validated.
  pam50_cord_dice_pass_min: 0.80
  pam50_cord_dice_warn_min: 0.60   # below = WARN; below this is FAIL
  min_vertebral_levels: 5          # already enforced in labeling.qc_thresholds
