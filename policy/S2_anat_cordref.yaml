version: 2

selection:
  # Dual-role anat selection:
  #
  # PRIMARY anat (this `preference` list) drives labeling (sct_label_vertebrae,
  # TotalSpineSeg), rootlets, PAM50 registration, and visualization
  # reportlets. Must be full-FOV — T2* / MEGRE (typically cord-only ~60mm Z)
  # is excluded because sct_label_vertebrae requires C2/C3 disc detection
  # and only accepts -c t1/-c t2.
  preference:
    - T2w
    - T1w
  # SECONDARY cordref (only used by S5/S6 func->anat registration) — when
  # T2star/MEGRE is available alongside the primary anat, S2 produces a
  # second cordref + cord_dseg in the matched contrast. T2*-anat <-> T2*-EPI
  # gives the cleanest seg-driven registration. When only the primary
  # modality is available, S5/S6 fall back to it automatically.
  secondary_cordref_preference:
    - T2star

# MEGRE synthesis: when a candidate is detected as multi-echo MEGRE
# (BIDS: sub-XX_acq-MEGRE_run-NN_echo-EE_part-mag_T2star.nii.gz), build a
# single 3D T2* image by RMS across echoes per run, then mean across runs.
# Recipe verbatim from CoSpi/spi03_anat_preproc.sh.
megre_synthesis:
  echo_combine: rms          # rms | mean | first_echo
  run_combine: mean          # mean | rms | first_run

standardize:
  orientation: RPI

discover:
  method: deepseg
  task: spinalcord
  contrast_map:
    T2star: t2s
    T2w: t2
    T1w: t1
  # Sanity-floor to catch "cord seg returned empty"; 10 slices is enough
  # cord coverage to be useful. MEGRE-style cervical-only acquisitions
  # typically have 12 slices.
  min_z_slices: 10

crop:
  # Deprecated: size_vox, z_full (kept for backward compat but ignored)
  size_vox: [96, 96]
  z_full: true
  mask_diameter_mm: 60
  dilate_xyz: [0, 0, 0]
  min_z_slices: 10

segmentation:
  # Cord segmentation method:
  #   contrast_agnostic: sct_deepseg spinalcord (optimized for CSA consistency)
  #   totalspineseg: extract cord from TotalSpineSeg output (simpler, all-in-one)
  cord_method: contrast_agnostic
  # Legacy settings (kept for backward compat)
  method: sct_deepseg_sc
  contrast_map:
    T2star: t2s
    T2w: t2
    T1w: t1

labeling:
  # Labeling method:
  #   totalspineseg: sct_deepseg -task totalspineseg (default, provides canal + vertebrae + labels)
  #   sct_label_vertebrae: legacy method
  method: totalspineseg
  # Legacy settings (used when method=sct_label_vertebrae)
  clean_labels: 1
  initcenter: 3
  # TotalSpineSeg QC thresholds
  qc_thresholds:
    min_vertebral_levels: 5
    min_coverage_ratio: 0.8
    max_inter_level_gap_mm: 15
    min_confidence: 0.7

rootlets:
  enabled: true
  eligible_modalities:
    - T2w
    - T1w

registration:
  template: PAM50
  prefer_rootlets: true
