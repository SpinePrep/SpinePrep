version: 1

# Per-run func->anat registration. SpinePrep's own seg-driven chain, built from
# SCT's standard sct_register_multimodal primitives, intensity-agnostic
# (type=seg) so it is contrast-invariant across the heterogeneous v1_validation
# anat (T1w vs T2w vs T2star).
#
# NOT "Kaptan 2023 verbatim" (corrected 2026-07-16, audit-v2 F1). Verified from
# Kaptan's published code (eippertlab/restingstate-reliability-spinalcord): their
# chain is TWO steps, `centermass -> bsplinesyn` (iter=3), and it registers the
# PAM50 template to the functional mean DIRECTLY (initialised by the anat->
# template warp) -- not a fresh func->own-anat registration. SCT's own default is
# also two steps (centermassrot -> bsplinesyn); `columnwise` and `iter=20` are
# both SpinePrep tuning, not SCT defaults. This chain is in the spirit of the
# Eippert-lab template-to-native approach but is not identical to it, and the
# 3-step composition is the operator's (CoSpi spi06_1fov_reg.sh), not a published
# recipe. See .claude/specs/s6-algorithm-audit-v2.md.
registration:
  # Direction: `-i funcref -d anat` (func is moving, anat is destination — cropped
  # to dilated cord region). Three slicewise seg-driven steps:
  #   1. centermassrot — COM alignment + slicewise rotation; required
  #      for oblique cord BOLDs (e.g. KombiShimZSpine 12° tilt).
  #   2. columnwise — R-L scaling + A-P columnwise deformation; handles
  #      cross-section variation along the cord axis.
  #   3. bsplinesyn iter=20 — non-linear B-spline refinement.
  # Tested on 11 subjects × 4 runs of KombiShimZSpine (2FOV) and a
  # 1FOV pilot; works on 11/12-slice partial-coverage acquisitions.
  step1:
    type: "seg"
    algo: "centermassrot"
    metric: "MeanSquares"
    slicewise: 1
    smooth: 1
  step2:
    type: "seg"
    algo: "columnwise"
    metric: "MeanSquares"
    slicewise: 1
    smooth: 1
  step3:
    type: "seg"
    algo: "bsplinesyn"
    metric: "MeanSquares"
    slicewise: 1
    iter: 20
  anat_crop:
    enable: true
    dilate: "10x10x10"        # sct_crop_image -m anat_seg -dilate ...
  interpolation: "spline"     # SCT -x flag

reproducibility:
  strict: false               # when true: ANTS_RANDOM_SEED=1, ITK_THREADS=1
  capture_provenance: true

qc_thresholds:
  # Cord Dice (warped EPI cord vs anat cord) is a CONVERGENCE check, not an
  # independent validator: the registration is seg-driven (type=seg maximises
  # cord-mask overlap), so a high Dice largely confirms the optimiser met its own
  # objective. It is structurally blind to axial (along-Z) mis-registration --
  # Dice on a smooth cord tube is near-invariant to shifts along its axis -- and
  # to intensity mismatch inside the cord. An independent metric (vertebral-level
  # agreement, or EPI-vs-anat intensity CC) is the open follow-up (audit-v2 F3).
  #
  # The 0.85 bar is SpinePrep's operating point on cord-cropped EPI, NOT a
  # literature-reported registration-Dice band (audit-v2 F2). The earlier comment
  # cited Cohen-Adad 2014 / De Leener 2017 / Gros 2019 for a "0.85-0.95 cord
  # registration Dice band"; that is unverified -- Gros 2019 reports SEGMENTATION
  # Dice (auto vs manual mask, ~0.9), a different quantity, and no cord-
  # REGISTRATION Dice band was found in the other two. The 0.65 floor is the
  # lower-quality-but-usable band, validated empirically on cord-cropped EPI.
  pass_dice_min: 0.85                # SpinePrep operating point (not a cited band)
  pass_dice_min_syn_fallback: 0.80   # lower bar for S5 SyN-fallback runs
  fail_dice_below: 0.65              # < this = FAIL; [fail, pass) = WARN; >= pass = PASS
  # HD95 in mm: OBSERVABILITY-ONLY (WARN ceiling, never FAIL) as of 2026-06-14.
  # It is quantized to the EPI slice thickness (~5mm) and dominated by single
  # rostral/caudal end-slice segmentation dropout, so it FAILed runs whose
  # registration is good by the step-local truth metric (cord Dice) — e.g.
  # exp pain sub-19 (Dice 0.886) was wrongly FAILed and lost. > pass = soft WARN.
  pass_hd95_mm_max: 4.0
  warn_hd95_mm_max: 8.0              # retained for reference; HD95 no longer FAILs
  # COM-based round-trip drift is observability-only in v1 (bsplinesyn's
  # forward + inverse are separately optimized → non-zero intrinsic drift
  # even at Dice 0.95). Setting permissive thresholds so it does not gate.
  pass_centerline_med_vox_max: 3.0
  warn_centerline_med_vox_max: 6.0
  pass_centerline_max_vox_max: 5.0
  warn_centerline_max_vox_max: 10.0

cost_controls:
  estimate_per_run_minutes: 3.0
  skip_existing_pass: true
