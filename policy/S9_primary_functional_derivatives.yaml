version: 1

# Per-run final preprocessed 4D BOLD outputs in native + PAM50, plus
# tSNR refs and per-vertebral-level tSNR. Cord-aware smoothing via
# sct_smooth_spinalcord. No high-pass on BOLD (cosine basis from S8
# handles it). No confound regression (left to the analyst's GLM).
#
# Sigma values are in mm, order R-L, A-P, S-I (SCT convention).
# σ = 1.0, 1.0, 8.0 → FWHM ≈ 2.35 × 2.35 × 18.84 mm (FWHM = 2.3548·σ).
# Anisotropic cord-aligned smoothing is the field convention (Eippert 2017;
# CoSpine spi14_2): light in-plane (~2.35 mm FWHM, ~1-2 voxels) preserves the
# small cord cross-section and avoids blurring cord signal into adjacent
# CSF/partial-volume, while heavy S-I (~18.8 mm FWHM) exploits the cord's
# columnar/segmental organisation to boost SNR without crossing functional
# boundaries. The exact kernel is reported in the methods + reproducibility
# receipt.

smoothing:
  method: "sct_cord"               # sct_smooth_spinalcord (cord-aware)
                                   # alternative: "gaussian_inplane" (scipy)
  sigma_mm: [1.0, 1.0, 8.0]        # R-L, A-P, S-I  (CoSpi spi14_2)
  # When method == "gaussian_inplane", only the first 2 sigmas are used
  # (in-plane Gaussian) and σ_z is forced to 0 (no through-slice blur).

# PAM50-space outputs:
#  - PAM50 funcref (temporal mean, 3D ~5 MB) — always emitted
#  - PAM50 tSNR (3D ~5 MB) — always emitted
#  - PAM50 4D BOLD (smoothed + unsmoothed) + co-gridded cord mask — ON.
#    The naive full-grid warp is ~17 GB/run (0.5mm 141×141×991 × ~200 vol).
#    We instead crop the 0.5mm PAM50 reference to each run's cord field-of-
#    view (nonzero extent of the warped funcref, padded) and warp DIRECTLY
#    into that cropped grid → ~1-2 GB/run, same 0.5mm space/resolution as
#    the funcref/tSNR products, co-gridded with the cord mask so the
#    template-space BOLD ships GLM-ready (BOLD + mask in one grid).
#    fMRIPrep analog: space-MNI152..._res-2 (template space, sane resolution).
pam50_4d_output:
  enabled: true                    # 4D BOLD in PAM50, cropped to cord FOV
  emit_unsmoothed: true            # also emit the unsmoothed PAM50 4D (Q2: both)
  fov_pad_vox: 4                   # padding (PAM50 voxels) around cord coverage
  # parallel_emit: run the smoothed + unsmoothed PAM50 4D warps CONCURRENTLY.
  # Byte-identical output, ~halves per-run PAM50 time — but within-run
  # parallelism multiplies with the orchestrator's --batch-workers, so under
  # batched releases it oversubscribes the machine (measured load ~52 on 32
  # cores) and is net SLOWER. DEFAULT OFF. Enable only for single-run / low-batch
  # contexts; for batched releases, scale --batch-workers instead. The PAM50
  # spline warp of the large 4D grid is the inherent S9 cost (the cord-smoothing
  # itself is ~15 s/run); set emit_unsmoothed:false to skip the second 4D apply
  # when the unsmoothed PAM50 series isn't needed.
  parallel_emit: false

# Output of per-vertebral-level tSNR — uses S7's
# *_desc-PAM50spinallevels.nii.gz (already in native func grid). Emits
# a TSV with (level, mean_tsnr, std_tsnr, n_voxels) for each unique
# label value found in the cord mask.
per_level_tsnr:
  enabled: true

# Residual smoothness verification via voxelwise autocorrelation in cord
# mask. Reports per-axis FWHM_x/y/z; expect to match requested ± tolerance.
fwhm_estimate:
  enabled: true
  tolerance_mm_xy: 0.5             # PASS bar in-plane
  tolerance_mm_xy_warn: 1.0
  tolerance_mm_z: 1.0              # PASS bar S-I (heavier smoothing)
  tolerance_mm_z_warn: 2.0

qc_thresholds:
  # tSNR ratio post/pre, median in cord mask. Cord-aware σ=1,1,8 should
  # raise tSNR by 1.5-2.5× on typical 1×1×5 acquisitions.
  pass_tsnr_ratio_min: 1.5
  warn_tsnr_ratio_min: 1.2
  fail_tsnr_ratio_below: 1.0       # < 1.0 means smoothing hurt — upstream issue
  # CoSpine 2025 baseline median in-cord tSNR
  pass_median_in_cord_tsnr: 5.0
  warn_median_in_cord_tsnr: 3.0
  # Cord-mask Dice between pre- and post-smoothed cord seg
  pass_cord_dice: 0.95
  warn_cord_dice: 0.85

reproducibility:
  strict: false
  capture_provenance: true

cost_controls:
  # sct_smooth_spinalcord straightens cord per volume; 200 vol ≈ 10 min
  estimate_per_run_minutes: 10.0
  skip_existing_pass: true
