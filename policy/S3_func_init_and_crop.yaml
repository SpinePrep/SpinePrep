version: 1

# MP-PCA thermal-noise denoising moved to its own step, S2B_func_denoise
# (policy/S2B_func_denoise.yaml), 2026-06-20. It must run on the raw 4D BOLD
# before any interpolation; S3 consumes S2B's denoised series when present
# (via _find_denoised_bold) and falls back to the raw BOLD otherwise.

# Dummy volume drop: remove initial unstable frames before computing reference
dummy:
  # Number of dummy volumes to drop from the start of each BOLD run
  drop_count: 4

# Coarse reference: fast initial reference before outlier gating
coarse_reference:
  # Aggregation method: median (robust) or mean (faster, less robust)
  method: median

# Func cord localization (S2 exact spec, mandatory)
func_localization:
  enabled: true  # Mandatory (no optional flag)
  method: deepseg
  # EPISeg (sct_deepseg sc_epi, Banerjee et al. 2025): the EPI-BOLD-specific cord
  # model. On BOLD EPI the contrast-agnostic `spinalcord` model (trained on
  # anatomical scans) quits where the cord curves anteriorly (lower cervical),
  # segmenting only the upper ~half; sc_epi follows the curve to the FOV edge.
  # S5-S9 already use sc_epi, so this aligns S3's crop with the rest of the
  # chain. See .claude/specs/s3-episeg-localization.md.
  task: sc_epi
  # EPISeg output cleanup (localize._cleanup_epi_cordseg). sc_epi can split the
  # cord into two on-axis components across the low-SNR curve gap and emit
  # off-axis brain specks; we bridge the fragments along Z and drop the specks
  # WITHOUT a naive largest-component keep (which would re-truncate the cord).
  cleanup:
    bridge_z_slices: 2   # Z-only dilation to close the curve gap between cord fragments
  discover:
    # Floor to reject "a couple of stray cord voxels" - not a coverage requirement.
    # Narrow-FOV acquisitions (e.g. KombiShimZSpine with 12 BOLD slices) are valid
    # and must not be dropped. The brain-contamination tests below carry the load.
    min_z_slices: 5
    # Robust caudal completion. sct_deepseg spinalcord on the COARSE full-FOV
    # functional reference under-segments the lower cord on low-SNR / low
    # coil-sensitivity runs; the cord-focused crop derived from the mask then
    # cuts off real caudal cord (observed 5-6 slices on AS002, 1-2 on CO001).
    # We union sct_propseg's contiguous caudal cord onto the deepseg mask.
    # It is caudal-only (never cranial, so the brainstem/drift gate is
    # untouched) and lateral-jump-guarded (rejects the bright anterior airway,
    # which sits well off the cord axis). No-op on runs whose deepseg mask
    # already reaches the imaged cord end / FOV edge.
    caudal_completion:
      # RETIRED 2026-07-13. These straight-line caudal patches (propseg union +
      # intensity trace) compensated for the weak `spinalcord` model by
      # extrapolating the centreline STRAIGHT DOWN — which walks off the
      # forward-curving cord and stops in the same place. EPISeg (task: sc_epi)
      # follows the curve natively, so they are obsolete and risk re-introducing
      # off-axis leakage. Disabled by default; kept behind this flag for one
      # release as a fallback before deletion. Do NOT re-enable with sc_epi.
      enabled: false
      propseg_contrast: t2   # func EPI reads as T2-like (bright CSF)
      axis_tol_mm: 5.0       # max deviation from the extrapolated deepseg cord axis; genuine caudal cord is near-straight (<3 mm), a vessel/airway runaway curves past this
      lateral_tol_mm: 8.0    # max per-slice cord-centroid shift; airway is ~15+ mm off-axis
      max_gap: 0             # stop at the first slice with no contiguous propseg cord
      area_mult: 3.0         # stop if a propseg slice balloons > 3x the median cord area
      # Second stage: intensity-guided caudal trace on the reference itself.
      # On the lowest-SNR runs neither deepseg nor propseg re-activate on the
      # faint caudal tail (observed MC001, WY001), so the propseg union above
      # is a no-op and real cord is still cut off. This stage traces the cord
      # slice-by-slice on the coarse functional reference from the caudal end,
      # separating cord from the bright CSF-filled canal with two size gates
      # scaled by the run's own cord area (band + compact-core), a lateral-jump
      # guard (rejects the anterior airway), and an intensity floor learned from
      # the caudal cord. It STOPS at the noise/CSF floor: where the tail is
      # CSF-dominated immediately below the terminus it is a no-op (verified
      # no-op on the 31 good runs, AS002 and LK001 already fixed by propseg).
      trace:
        enabled: false         # RETIRED 2026-07-13 with caudal_completion (see above); sc_epi follows the curve
        intensity_frac: 0.5    # bright-cord threshold = frac x caudal cord intensity; below this = noise floor -> stop
        radius_vox: 6          # in-plane search half-window (~10 mm at 1.6 mm) around the previous cord centroid
        lateral_tol_mm: 5.0    # max per-slice centroid shift; the anterior airway is ~15 mm off and is rejected
        core_area_max: 2.2     # reject if the compact bright core > 2.2x the run's robust cord area (CSF band)
        band_area_max: 3.0     # reject if the full bright component > 3.0x cord area (wide CSF canal fills the window).
                               # 3.0 is the empirical separatrix: the genuine caudal cord blob on CO001/WY001 sits at
                               # ~2.8x while the CSF terminus just below AS002/LK001's true end sits at ~3.1x. It is a
                               # narrow margin -- these are near-identical at this SNR -- so the trace is intentionally
                               # scoped by policy to run only where deepseg under-segments; treat as a tunable knob.
        min_area_vox: 6        # ignore sub-cord specks
        core_peak_frac: 0.6    # compact core = component voxels >= 0.6 x local peak (isolates cord from a dim halo)
        max_gap: 1             # bridge a single faint slice; two consecutive rejects stop the trace
    drift_gate:
      enabled: true
      superior_slices_check: 5
      area_spike_threshold: 4.0
      absolute_area_cap_mm2: 200.0
  crop:
    mask_diameter_mm: 60  # Configurable, default match S2
    min_z_slices: 5

# Outlier gating: identify motion-corrupted frames using cord-centric metrics.
# Definitions: Power 2014 DVARS (RMS of temporal derivative) restricted to the
# cord mask (Power 2014 defines DVARS within a spatial mask; the cord-restricted
# mask is SpinePrep's choice, tighter than Kaptan 2023's 41 mm cord-centred
# cylinder) + DVARS-ref (RMS of
# (frame - reference) within mask; aka "refRMS" in Kaptan 2023 / Dabbagh 2024,
# kept as the canonical "DVARS-ref" name on reportlets and in docs).
outlier_gating:
  # Boxplot cutoff P75 + 1.5*IQR: the documented default of FSL
  # `fsl_motion_outliers` (Tukey 1977). NOTE: this is a deviation from the cord
  # papers, which threshold on the run's own mean + k*SD: Kaptan 2023 uses 2 SD,
  # Dabbagh 2024 uses 3 SD. We chose the boxplot rule because it is
  # parameter-free, robust to the non-Gaussian heavy-tailed cord DVARS
  # distribution, and adaptive to per-run scanner variability without a
  # group-mean calibration. Do NOT describe this as the "fMRIPrep convention":
  # fMRIPrep thresholds standardised DVARS > 1.5 and FD > 0.5 mm, with no IQR
  # rule. Audit: .claude/specs/s3-algorithm-audit.md
  iqr_multiplier: 1.5
  # Dual criterion (DVARS OR DVARS-ref above threshold) — Power 2014 / Kaptan 2023.
  metrics:
    - dvars     # RMS of frame-to-frame intensity difference within mask
    - dvars_ref # RMS of frame-to-reference intensity difference within mask
  # NOTE: the outlier_fraction PASS/WARN thresholds live in qc_thresholds below
  # (single source of truth). outlier_fraction is a soft WARN-only gate — it
  # never FAILs (high motion is the analyst's GLM-time call, consistent with S8).
  # Minimum good (non-outlier) frames to build the robust median funcref.
  min_good_frames: 10

# Robust reference: final reference from non-outlier frames
robust_reference:
  # Aggregation method: median (recommended) or mean
  method: median

# Cord-focused crop: reduce FOV to cord region.
crop:
  # Crop mask diameter (mm) around cord centerline. CoSpine 2025 uses 35 mm
  # (tighter, cord-only). 60 mm gives extra anatomical context for S6 func-
  # to-anat registration (more landmarks) at the cost of ~70% more in-plane
  # voxels in downstream BOLD. Tune per cohort; cord-only acquisitions
  # should consider 35-40 mm.
  mask_diameter_mm: 60
  # 2-voxel in-plane dilation (SCT convention) for safety margin against
  # localization jitter between dummy-drop coarse ref and final funcref.
  dilate_xyz: [2, 2, 0]
  # Minimum z-slices in cropped output. Cord-fMRI typical 12-24 BOLD slices.
  min_z_slices: 10

# QC and reportlets
qc:
  # T2-to-func overlay: contour line width
  overlay_contour_width: 2
  # Frame metrics plot: figure size (inches)
  frame_metrics_figsize: [10, 4]
  # Funcref montage: number of axial slices to show
  montage_slices: 9
  # Crop box sagittal: show crop ROI on funcref

# Step-local truth gates (CLAUDE.md dev principle §3). Frame-metric
# outlier fraction is the headline gauge: a cord-fMRI run with > 20%
# DVARS/refRMS outliers is unusable downstream (Mohammed 2020,
# Kaptan 2023). PASS gate set conservatively; retune on the reg cohort.
qc_thresholds:
  outlier_fraction_pass_max: 0.20  # ≤20% outliers ⇒ PASS gate (Kaptan 2023)
  outlier_fraction_warn_max: 0.40  # 20–40% ⇒ WARN; above ⇒ FAIL

# Cost controls: prevent accidental expensive runs
cost_controls:
  # Skip runs that already have PASS status with the same code_hash
  skip_existing_pass: true
  # Track code_hash in each run for skip decisions
  check_code_hash: true
  # Runtime estimation (minutes per run, assuming 48 workers)
  estimate_per_run_minutes: 1.0

