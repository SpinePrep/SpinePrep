version: 1

# Motion Correction Strategy
# mode: "3d+2d" (default) | "3d" | "2d"
# "3d+2d": two-stage correction (bulk MCFLIRT -> slice-wise)
# "3d": only bulk MCFLIRT
# "2d": only slice-wise (sct_fmri_moco)
#
# Stage 1 = FSL MCFLIRT, a 3D 6-DOF rigid realignment of each volume to the
# robust reference (cost=leastsquares, spline_final), matching the CoSpi cord
# recipe (spi06_2_motioncorrection.sh) and Mohammed 2020. It captures 3
# translations + 3 rotations (the standard motion nuisance regressors) and
# feeds a full Power-2012 6-DOF FD. Replaces the old custom 2-DOF
# FLIRT-on-Z-mean (which estimated in-plane X/Y only). Stage 2 = sct_fmri_moco
# slicewise. Note sct_fmri_moco also runs its own internal 3D rigid before
# SliceReg, so "3d+2d" is bulk-redundant; harmless (converges in 1 iter).
motion_correction:
  mode: "3d+2d"

  # Stage 1: bulk MCFLIRT (3D 6-DOF rigid). No tunable knobs — fixed CoSpi recipe
  # (mcflirt -reffile <robust ref> -cost leastsquares -spline_final -plots).
  stage1_coarse:
    method: "mcflirt"
    
  # Stage 2: Slice-wise Correction (sct_fmri_moco)
  stage2_slicereg:
    poly_order: 2  # Polynomial z-regularization order
    metric: "MeanSquares"  # Registration metric (MeanSquares | MI)
    iterations: 10  # Max iterations per slice
    smooth: 0  # Smoothing kernel (mm)

  # Inter-run Z-shift Correction (Optional)
  z_shift_correction:
    enabled: false  # Disabled by default
    threshold_mm: 2.0  # Threshold for detecting significant z-shifts

# Quality Control Thresholds
qc_thresholds:
  # FAIL thresholds (hard stop/fail status)
  max_fd_mm: 3.0
  min_tsnr: 3.0
  max_high_motion_fraction: 0.50
  
  # WARN thresholds (warning status)
  warn_fd_mm: 2.0
  warn_tsnr: 5.0
  warn_high_motion_fraction: 0.30
  
  # Definition of "High Motion" frame
  fd_threshold_mm: 0.5

# QC Reportlet Visual Configuration
qc:
  # Motion traces plot (S4_motion_traces.png)
  motion_traces:
    figsize: [10, 4]
    dpi: 100
    colors:
      tx: "#1f77b4"  # blue
      ty: "#ff7f0e"  # orange
      tz: "#2ca02c"  # green (future)
      threshold: "red"
    grid_alpha: 0.3

  # tSNR comparison montage (S4_tsnr_comparison.png)
  tsnr_comparison:
    figsize: [12, 6]
    dpi: 100
    n_slices: 9  # 3x3 grid
    colormap: "viridis"
    background: "black"

  # DVARS plot (S4_dvars_plot.png)
  dvars_plot:
    figsize: [10, 4]
    dpi: 100
    line_color: "#1f77b4"
    threshold_color: "red"
    outlier_marker_size: 20
    grid_alpha: 0.3


# Cost controls
cost_controls:
  estimate_per_run_minutes: 5.0
  skip_existing_pass: true
  check_code_hash: true
