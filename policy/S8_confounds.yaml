version: 1

# Per-run confound + physio regressor extraction. Emits BIDS-Derivatives
# `*_desc-confounds_timeseries.tsv` + JSON sidecar. Five families, mixed
# scalar + slicewise. Native func space only; no BOLD resampling; no
# regression (analyst owns that at S9). See round-3 audit
# (.claude/specs/s8-confounds-and-physio-regressors.md) for full
# justification of each parameter and citation trail.

# ----------------------------------------------------------------------
# 1. Motion (always present, S4-derived)
# trans_x, trans_y: slicewise-mean translation per volume from S4 NIfTI
# params. derivative1 via np.diff(prepend=0). FD = |Δtrans_x| + |Δtrans_y|
# (Power 2-D adapted for cord 2-D moco). DVARS + refRMS already computed
# by S3.2 (frame_metrics.tsv); we just repack with outlier flags.
#
# Outlier gating (audit-v2 .claude/specs/s8-outlier-rate-root-cause.md):
#   - FD threshold = 0.5 mm — Power 2014 (its "lenient" FD scrubbing cutoff;
#     the same paper also defines a "stringent" FD > 0.2 mm). DOC-2: do NOT
#     credit this to Kaptan 2023 — Kaptan uses NO FD threshold at all; it flags
#     outlier volumes on dVARS/refRMS (≥2 SD above the run mean, via FSL
#     fsl_motion_outliers). The earlier 0.2 mm here was both wrong (should be
#     0.5 for cord) and mis-cited. Cohort outlier rate dropped 15-83% → 2-30%
#     after the 0.5 correction, matching the literature 5-30% band.
#   - DVARS / refRMS gate = box-plot fence Q3 + 1.5·IQR, the documented default of
#     FSL `fsl_motion_outliers` (Tukey 1977). Do NOT call this the "fMRIPrep
#     convention": fMRIPrep thresholds standardised DVARS > 1.5 and FD > 0.5 mm and
#     has no IQR rule. It also differs from the cord papers, which use the run's
#     mean + k·SD (Kaptan 2023: 2 SD; Dabbagh 2024: 3 SD). We keep the box-plot
#     fence because cord DVARS is heavy-tailed and the rule is parameter-free.
motion:
  fd_outlier_threshold_mm: 0.5     # Power 2014 (lenient FD scrub). NOT Kaptan (uses dVARS/refRMS, no FD)
  dvars_outlier_iqr_k: 1.5         # box-plot fence Q3 + k·IQR (FSL fsl_motion_outliers default; Tukey 1977)
  refrms_outlier_iqr_k: 1.5        # same — dual criterion (OR)

# ----------------------------------------------------------------------
# 2. CSF aCompCor, slicewise (always present when the CSF mask exists)
# Per slice z: the top-N principal components (eigenvariates) of the CSF ROI =
# `n_components` columns per slice (csf_slice{z}_pc{k}). aCompCor (Behzadi 2007)
# applied per slice, matching CoSpi spi12_acompcor.m (5 PCs/slice).
# TOOLS (decided with Gergely + Jan Valošek in Slack, replacing Matlab SPM
# PhysIO which is hard to embed): FSL `fslmeants --eig --order N` computes the
# eigenvariates; the BOLD is per-voxel constant+linear detrended (numpy lstsq)
# first to match PhysIO's pre-PCA step. Validated in
# research/physio_vs_fslmeants_acompcor. erode_voxels: 0 (cord-CSF too thin).
# Min voxel count per slice: 5; otherwise that slice is skipped with a flag.
# NOTE: this multiplies CSF columns ~5x (5 PCs × N_slices) — designed for a
# SLICEWISE GLM (CoSpi/FEAT), where each slice's model uses only its 5 CSF PCs.
csf_slicewise:
  enabled: true
  # mask_source: "S2_canal_minus_cord" (default, subject-specific) builds
  # CSF mask from S2's anat-space canal_dseg minus cord_dseg, warped to
  # native func via S6's from-anat_to-bold xfm. Falls back to
  # "S7_pam50csf" (PAM50 template CSF warped to native) when S2 outputs
  # or S6 warp are unavailable.
  mask_source: "S2_canal_minus_cord"
  method: "acompcor_fslmeants_eig"  # FSL fslmeants --eig (PCs), not SPM PhysIO
  n_components: 5                  # 5 PCs/slice (CoSpi spi12_acompcor.m)
  erode_voxels: 0                  # no erosion (cord-CSF too thin)
  min_voxels_per_slice: 5          # numerical-stability floor

# ----------------------------------------------------------------------
# 3. RETROICOR slicewise via FSL PNM (when BIDS physio readable)
# popp -> pnm_evs. EV count = 2*oc + 2*or + 4*multc*multr. With oc=or=4 and
# interaction order 2 (multc=multr=2): 8 cardiac + 8 respiratory + 16 interaction
# = 32 regressors per slice (Kaptan 2023 / Dabbagh 2024 cord recipe). Cord-mean
# each EV within S3 funccrop_mask per slice for the TSV row. Short runs set
# interaction_order=0 -> drop interactions (16 total). Dabbagh 2024 recipe.
retroicor:
  enabled: true                    # auto-disable when physio absent
  cardiac_order: 4                 # 8 regressors (sin + cos × 4)
  respiratory_order: 4             # 8 regressors
  interaction_order: 2             # FSL pnm_evs --multc/--multr order; 4·2·2 = 16 interaction EVs
  # TSV aggregation. Slicewise pnm_evs EVs (constant within slice) are
  # aggregated to one column per EV for the BIDS-style flat TSV.
  #   slice_mean  — mean across cord-bearing slices (Kaptan/Dabbagh:
  #                 ~32 RETROICOR cols per run; recommended)
  #   central_slice — just the middle cord slice
  #   slicewise   — per-slice columns (~32 × N_slices; only when N_slices
  #                 is small and you need slicewise GLM)
  aggregation: "slice_mean"
  use_csf_regressor_from_pnm: false  # we compute CSF separately (csf_slicewise)
  hr_rvt_enabled: true             # heart rate + RVT slow regressors (2 cols; popp --rvt --heartrate)

# ----------------------------------------------------------------------
# 4. Cosine basis (optional; default ON)
# DCT high-pass equivalent. Default 1/100 s = 0.01 Hz (Kaptan 2023 /
# Dabbagh 2024 cord standard). fMRIPrep brain default is 1/128 s.
# enabled: false omits the family (e.g. when the analyst's GLM owns high-pass).
cosine:
  enabled: true                    # toggle the DCT high-pass family
  cutoff_hz: 0.01                  # = 1/100 s

# ----------------------------------------------------------------------
# 5. SpinalCompCor (opt-in for v1; Hemmerling 2025)
# Dilate (cord ∪ CSF) mask by 18 mm rounded to voxels, subtract original,
# remove up to 3 edge voxels in slice FOV → noise ROI. Per-slice SVD on
# voxel × time matrix (mean-center + DCT-detrend per voxel first).
# Component count via parallel analysis: 50 IAAFT surrogates per voxel,
# eigenvalue-intersection cutoff. Off by default v1; default ON for v2
# pending validation on the 5 reg datasets.
spinalcompcor:
  enabled: true                    # optional family; ON by default, set false to omit
  dilation_mm: 18.0                # Hemmerling 2025 noise ROI (rounded to voxels)
  edge_voxel_remove: 3             # up to 3 voxels at slice FOV edge
  pre_pca_mean_center: true        # fMRIPrep convention (paper omits; safer)
  pre_pca_dct_detrend_hz: 0.01     # match cosine HP cutoff
  min_voxels_per_slice: 10         # PCA stability floor for small ROIs
  min_volumes: 100                 # IAAFT needs reasonable timeseries length
  # Aggregation:
  #   global_3d — single 3D PCA over all noise-ROI voxels (default).
  #               K columns total. fMRIPrep brain a_comp_cor convention;
  #               viable for any run length.
  #   slicewise — per-slice PCA (Hemmerling 2025 reference layout).
  #               K × N_slices columns; only fits long runs.
  aggregation: "global_3d"
  # Component selection:
  #   fixed_n  — top-K PCs (Behzadi 2007 / fMRIPrep). Fast; default.
  #   iaaft    — Hemmerling 2025 parallel analysis with IAAFT surrogates.
  #              Validated but slow (~30 min/run); use for research only.
  #   kaiser   — eigenvalue > mean. Lightweight middle ground.
  component_selection: "fixed_n"
  fixed_n_components: 5            # top-5 PCs (CompCor default; matches fMRIPrep)
  # Below only used when component_selection: "iaaft"
  n_iaaft_surrogates: 50           # Hemmerling 2025 reference
  iaaft_max_iter: 500              # convergence cap per Hemmerling

# ----------------------------------------------------------------------
# QC thresholds
qc_thresholds:
  # Matrix condition number — brain heuristic; calibrate on cord empirically.
  # PER-SLICE gate (Option A): the per-slice CSF aCompCor family is applied
  # slice-locally downstream (CoSpi/FEAT voxelwise EVs — each slice's GLM sees
  # only its own 5 PCs; spi12_acompcor.m → spi15_*.fsf). So we score each
  # slice's REAL design = global regressors + that slice's per-slice columns,
  # and gate on the WORST slice (condition_number). condition_number_global
  # (global-only regressors) is reported alongside for diagnosis. Scoring the
  # flat union of all 5×N_slices CSF columns would explode for a design no
  # voxel ever fits — that is not what the downstream GLM does.
  pass_condition_number: 1000.0
  warn_condition_number: 10000.0
  # Outlier fraction (volumes flagged as FD>0.5 OR DVARS/refRMS Tukey).
  # After the root-cause fix (s8-outlier-rate-root-cause.md), empirical
  # reg-cohort range is 2-30%. Set PASS at 0.20 (Power 2014 scrubbing
  # standard); WARN above; classifier still only soft-WARNs
  # (never FAILs on OF) because high motion is the analyst's problem
  # at GLM time.
  pass_outlier_fraction_max: 0.20
  warn_outlier_fraction_max: 0.40

# ----------------------------------------------------------------------
reproducibility:
  strict: false                    # numpy seed for IAAFT when true
  capture_provenance: true

cost_controls:
  estimate_per_run_minutes: 2.0    # 3.0 with SpinalCompCor enabled
  skip_existing_pass: true
