version: 1

# S10 aggregates S1-S9 outputs into release-readiness deliverables.
# (S10 ROI-timeseries/connectivity was removed from the active pipeline
# 2026-06-11 — analyst-owned analysis, not preprocessing.)
# 13 items across 4 tiers: aggregation core, cord-novel cohort views,
# publication/reproducibility, compliance/navigation.
# See .claude/specs/s11-qc-aggregation-and-release.md for design rationale.

# ----------------------------------------------------------------------
# Tier 1: aggregation core
aggregation:
  per_subject_html:
    enabled: true
    thumbnail_link_only: true        # link to PNGs (smaller HTML); base64 = v1.1
    thumbnail_per_step:
      S2_anat_cordref: "cordmask_montage"
      S3_func_init_and_crop: "func_localization"
      S4_func_motion_correction: "S4_tsnr_comparison"
      S5_func_distortion_correction: "crop_box_sagittal"
      S6_func_to_anat_registration: "bold_on_anat_axial"
      S7_template_normalization: "pam50_overlay_axial"
      S8_confounds_and_physio_regressors: "confound_columns"
      S9_primary_functional_derivatives: "tsnr_map_axial"

  group_dashboard:
    enabled: true
    # MRIQC group dashboard convention: one boxplot per metric, subject
    # dots colored by dataset. Each path is `<step>.metrics.<key>` and
    # must match the key the step actually emits in its qc.json (verify
    # against schemas/qc_S?_*.schema.json before adding).
    metric_distributions:
      - "S4.metrics.mean_fd_mm"
      - "S6.metrics.cord_dice"
      - "S7.metrics.cord_dice_native_func"
      - "S9.metrics.tsnr_post_median"

  metrics_index:
    enabled: true

  run_inventory:
    enabled: true

# ----------------------------------------------------------------------
# Tier 2: cord-novel cohort transparency
cohort_views:
  coverage_matrix:
    enabled: true
    # rows: subject; cols: vertebral levels 1..N
    n_levels: 8                      # cervical focus (C1..T1 vertebrae)

  tsnr_heatmap:
    enabled: true
    # Source: S9 *_desc-tsnr_per_level.tsv (mean_tsnr per level).
    # Kaptan 2023 boxplot-with-subject-dots convention; one box per
    # spinal level. Range 0..30 — cervical cord median tSNR typically
    # 8-20; the previous 0..50 cap left the high end unused.
    color_range: [0, 30]


# ----------------------------------------------------------------------
# Tier 3: publication & reproducibility
publication:
  reproducibility_receipt:
    enabled: true
    capture_packages:
      - "nilearn"
      - "nibabel"
      - "scipy"
      - "numpy"
      - "pandas"
      - "matplotlib"
      - "scikit-image"
      - "scikit-learn"
      - "joblib"

  citation_cff:
    enabled: true
    # Self-citation template — fill at runtime
    name: "SpinePrep"
    description: "Cervical spinal cord fMRI preprocessing pipeline"

  references_bib:
    enabled: true
    # Auto-bibliography of every methods reference the chain uses

  dataset_description:
    enabled: true
    # BIDS-Derivatives manifest; DatasetType=derivative + GeneratedBy

  participants_tsv:
    enabled: true
    columns:
      - "participant_id"
      - "dataset_key"
      - "n_runs"
      - "n_sessions"
      - "n_passed"
      - "n_warn"
      - "n_failed"
      - "mean_fd_mm"
      - "median_in_cord_tsnr"
      - "included_recommendation"
    # FD is NOT an inclusion criterion and this key is retained only so old
    # configs still parse. It formerly drove a "mean FD > 0.5 mm (Kaptan 2023)"
    # exclusion recommendation, which was wrong three ways: Kaptan 2023 computes
    # no FD at all (it censors on DVARS/refRMS at 2 SD); 0.5 mm is Power 2012's
    # BRAIN value; and it sits at this cohort's own FD median (0.494 mm), so it
    # flagged 265/467 runs. S4 removed the equivalent gate on 2026-07-16 --
    # "reporting a fraction-above-an-invalid-threshold is a claim, and it was a
    # claim above its evidence" -- and that fix had not propagated here.
    include_threshold_fd: null       # unused; FD is descriptive only
    include_threshold_tsnr: 5.0      # tSNR < 5 → flag for review

  methods_manifest:
    enabled: true
    formats: ["markdown", "latex", "html"]

# ----------------------------------------------------------------------
# Tier 4: navigation
compliance:
  # sidecar_audit dropped 2026-05-28 (audit B11): function name promised
  # BIDS sidecar coverage but implementation only checked reportlet PNG
  # existence. Field standard is bids-validator (Markiewicz 2021 eLife);
  # since it's not installed here, the deliverable is removed entirely.
  # If reintroduced, wrap bids-validator's JSON output, don't reinvent.
  release_report:
    enabled: true                    # top-level release_report.html index

# ----------------------------------------------------------------------
qc_thresholds:
  pass_min_subject_report_fraction: 0.80
  warn_min_subject_report_fraction: 0.50
  # Upstream run rollup. Added 2026-07-19: S10's verdict previously depended
  # only on whether the HTML rendered, so the release reported PASS while its
  # own inventory held 18 FAILed and 410 WARN runs out of 469.
  pass_max_run_fail_fraction: 0.05   # > this = WARN
  warn_max_run_fail_fraction: 0.20   # > this = FAIL
  pass_max_missing_qc_fraction: 0.05
  warn_max_missing_sidecar_fraction: 0.10

# ----------------------------------------------------------------------
reproducibility:
  strict: false
  capture_provenance: true

cost_controls:
  estimate_per_run_minutes: 0.2      # S10 is fast; walks finished QC files
  skip_existing_pass: false          # always re-aggregate (cheap)
