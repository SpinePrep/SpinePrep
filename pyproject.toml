[tool.poetry]
name = "spineprep"
version = "26.0.0"
description = "A containerised BIDS-App for reproducible spinal-cord fMRI preprocessing with per-vertebral-level quality control"
license = "Apache-2.0"
authors = ["Kiomars Sharifi <sharifikiomars@gmail.com>"]
maintainers = ["Kiomars Sharifi <sharifikiomars@gmail.com>"]
readme = "README.md"
homepage = "https://spineprep.com"
repository = "https://github.com/SpinePrep/SpinePrep"
documentation = "https://spineprep.com"
keywords = ["spinal cord", "fMRI", "preprocessing", "BIDS-App", "neuroimaging", "quality-control", "PAM50"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "spineprep", from = "src" }]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/SpinePrep/SpinePrep/issues"
"Changelog" = "https://github.com/SpinePrep/SpinePrep/blob/main/CHANGELOG.md"
"Community (NeuroStars)" = "https://neurostars.org/tag/spineprep"

[tool.poetry.scripts]
spineprep = "spineprep.cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pyyaml = "^6.0.1"
jsonschema = "^4.23.0"
nibabel = "^5.2.1"
pillow = "^12.0.0"
matplotlib = "^3.10.8"
scipy = "<1.15"
pandas = "<2.2"
scikit-image = "<0.24.0"
numpy = "<2.0.0"
nilearn = ">=0.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
mkdocs-minify-plugin = "^0.8.0"
mkdocs-redirects = "^1.2.0"
mkdocs-git-revision-date-localized-plugin = "^1.2.0"
mkdocs-glightbox = "^0.4.0"
mkdocstrings = {extras = ["python"], version = "^0.26.1"}


[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
